services:
  linguaspark:
    image: ghcr.io/kozakura913/linguaspark:main
    ports:
      - "3000:3000"
    volumes:
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - ./models:/home/linguaspark/models
    environment:
      API_KEY: ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "echo -e 'GET /health HTTP/1.1\r\nHost: localhost:3000\r\n\r\n' | timeout 5 bash -c 'cat > /dev/tcp/localhost/3000' && echo 'Health check passed'"]
      interval: 30s
      timeout: 10s
      retries: 3
